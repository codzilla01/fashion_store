[package]
name = "naseej-license-format"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
ed25519-dalek = "3.0.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
