name: Autoformat

# Applies `cargo fmt` to every Rust crate in the workspace and pushes the
# result. Formatting-only change: it never touches behaviour.
#
# Run it from the branch you want formatted:
#   gh workflow run autoformat.yml -f branch=<branch>

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to format and commit to"
        required: true
        default: "arena/ad56f97c-fashion-store"

concurrency:
  group: autoformat-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fmt:
    name: Apply rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt on every crate
        run: |
          for crate in crates/license-format tools/license-issuer apps/pos-desktop/src-tauri apps/activation-tool/src-tauri; do
            echo "--- formatting $crate"
            (cd "$crate" && cargo fmt)
          done

      - name: Verify formatting is now clean
        run: |
          for crate in crates/license-format tools/license-issuer apps/pos-desktop/src-tauri apps/activation-tool/src-tauri; do
            (cd "$crate" && cargo fmt --check)
          done

      - name: Commit and push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add -A
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:${{ inputs.branch }}"
