[package]
name = "naseej-activation-tool"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.5" }

[dependencies]
tauri = { version = "2.12.0" }
naseej-license-format = { path = "../../../crates/license-format" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"] }
