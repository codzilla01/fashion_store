[package]
name = "naseej-super-admin"
version = "0.1.0"
description = "Developer dashboard for Naseej subscriptions and customer activation"
authors = ["Naseej POS"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chrono = { version = "0.4", features = ["clock", "serde"] }
ed25519-dalek = "3.0.0"
getrandom = "0.3"
hex = "0.4"
naseej-license-format = { path = "../../../crates/license-format" }
naseej-license-registry = { path = "../../../crates/license-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
