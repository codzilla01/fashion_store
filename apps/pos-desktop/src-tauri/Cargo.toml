[package]
name = "naseej-pos"
version = "0.1.0"
description = "Local-first apparel point of sale"
authors = ["Naseej POS"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
aes-gcm = "0.10.3"
flate2 = "1.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
naseej-license-format = { path = "../../../crates/license-format" }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
hex = "0.4"
sha2 = "0.11"
argon2 = "0.5.3"
getrandom = "0.3"
password-hash = "0.5"
zeroize = "1.8"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
